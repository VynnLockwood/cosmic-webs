[project]
name = "cosmic-webs-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pglast>=7", "psycopg[binary]>=3.2", "faker>=30", "httpx>=0.27"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.setuptools]
packages = ["app"]
