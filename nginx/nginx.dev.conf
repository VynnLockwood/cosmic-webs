events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 80;
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; client_max_body_size 20m; }
    location / { proxy_pass http://web:5173; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }
  }
}
