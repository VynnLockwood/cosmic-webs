server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/wasm;

  # hashed build files never change: cache for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # the page itself must always be fresh so it points at the newest hashed files
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location / {
    try_files $uri /index.html;
  }
}
