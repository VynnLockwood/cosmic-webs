events {}
http {
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/wasm;
  server {
    listen 80;
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_read_timeout 60s; client_max_body_size 20m; }
    location / { proxy_pass http://web:80; proxy_set_header Host $host; }
  }
}
