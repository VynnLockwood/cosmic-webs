    <h1>The planner runs in your browser; the server only talks to Postgres</h1>

<title id="architecture-title">Cosmic Webs architecture</title>
<desc id="architecture-desc">The browser runs the React and three.js view and a Rust core compiled to WebAssembly in a worker. Requests go over HTTPS to nginx, which proxies them to the FastAPI service. FastAPI runs SQL against the sandbox Postgres and, optionally, a live Postgres, both through read-only roles. For the optional Expected result feature the browser sends table and column names, never rows, straight to OpenRouter with their own key.</desc>
