services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./api/app:/srv/app", "./samples:/samples"]
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes: ["./web:/app"]
  nginx:
    volumes: ["./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro"]
