services:
  sandbox-pg:
    image: postgres:16
    environment: { POSTGRES_USER: cosmos, POSTGRES_PASSWORD: cosmos, POSTGRES_DB: cosmos }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cosmos"], interval: 3s, retries: 20 }
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment: { SANDBOX_DSN: "postgresql://cosmos:cosmos@sandbox-pg:5432/cosmos" }
    depends_on: { sandbox-pg: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: web/Dockerfile }
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api, web]
